<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="500" height="400" fill="#ffffff"/>

  <!-- Axes -->
  <line x1="40" y1="200" x2="470" y2="200" stroke="#333333" stroke-width="1.5"/>
  <line x1="250" y1="20" x2="250" y2="380" stroke="#333333" stroke-width="1.5"/>
  <text x="460" y="215" font-size="14" fill="#333333">x</text>
  <text x="260" y="32" font-size="14" fill="#333333">y</text>

  <!-- Contour circles for f(x,y) = x^2 + y^2 -->
  <circle cx="250" cy="200" r="40" fill="none" stroke="#4C78A8" stroke-width="2"/>
  <circle cx="250" cy="200" r="80" fill="none" stroke="#4C78A8" stroke-width="2"/>
  <circle cx="250" cy="200" r="120" fill="none" stroke="#4C78A8" stroke-width="2"/>
  <circle cx="250" cy="200" r="160" fill="none" stroke="#4C78A8" stroke-width="2"/>

  <text x="290" y="196" font-size="12" fill="#4C78A8">f=1</text>
  <text x="330" y="196" font-size="12" fill="#4C78A8">f=4</text>
  <text x="370" y="196" font-size="12" fill="#4C78A8">f=9</text>
  <text x="410" y="196" font-size="12" fill="#4C78A8">f=16</text>

  <!-- Point on the r=80 contour -->
  <circle cx="330" cy="200" r="4" fill="#E45756"/>
  <text x="336" y="192" font-size="13" fill="#E45756">(a, b)</text>

  <!-- Gradient vector: radial, pointing outward (steepest ascent) -->
  <line x1="330" y1="200" x2="400" y2="200" stroke="#E45756" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="365" y="188" font-size="13" fill="#E45756">&#8711;f</text>

  <!-- Tangent to contour at that point (perpendicular to gradient) -->
  <line x1="330" y1="160" x2="330" y2="240" stroke="#54A24B" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="336" y="158" font-size="12" fill="#54A24B">tangent to level curve</text>

  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E45756"/>
    </marker>
  </defs>

  <text x="60" y="370" font-size="14" fill="#333333">Level curves of f(x,y) = x&#178; + y&#178;. The gradient &#8711;f at (a,b) is</text>
  <text x="60" y="388" font-size="14" fill="#333333">perpendicular to the level curve and points toward increasing f.</text>
</svg>
