<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="500" height="400" fill="#ffffff"/>

  <!-- Axes -->
  <line x1="40" y1="200" x2="470" y2="200" stroke="#333333" stroke-width="1.5"/>
  <line x1="250" y1="20" x2="250" y2="380" stroke="#333333" stroke-width="1.5"/>
  <text x="460" y="215" font-size="14" fill="#333333">x</text>
  <text x="260" y="32" font-size="14" fill="#333333">y</text>

  <!-- Hyperbola-like level curves for f(x,y) = x^2 - y^2, opening left-right (f > 0) -->
  <path d="M 320 40 Q 270 200 320 360" fill="none" stroke="#4C78A8" stroke-width="2"/>
  <path d="M 380 40 Q 300 200 380 360" fill="none" stroke="#4C78A8" stroke-width="2"/>
  <path d="M 180 40 Q 230 200 180 360" fill="none" stroke="#4C78A8" stroke-width="2"/>
  <path d="M 120 40 Q 200 200 120 360" fill="none" stroke="#4C78A8" stroke-width="2"/>

  <!-- Hyperbola-like level curves opening up-down (f < 0) -->
  <path d="M 40 140 Q 250 190 460 140" fill="none" stroke="#E45756" stroke-width="2"/>
  <path d="M 40 90 Q 250 170 460 90" fill="none" stroke="#E45756" stroke-width="2"/>
  <path d="M 40 260 Q 250 210 460 260" fill="none" stroke="#E45756" stroke-width="2"/>
  <path d="M 40 310 Q 250 230 460 310" fill="none" stroke="#E45756" stroke-width="2"/>

  <!-- Saddle point marker -->
  <circle cx="250" cy="200" r="5" fill="#000000"/>
  <text x="258" y="196" font-size="13" fill="#000000">saddle: (0,0)</text>

  <!-- Direction arrows -->
  <line x1="250" y1="200" x2="330" y2="200" stroke="#4C78A8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="335" y="196" font-size="12" fill="#4C78A8">f increases</text>

  <line x1="250" y1="200" x2="250" y2="150" stroke="#E45756" stroke-width="3" marker-end="url(#arrowRed2)"/>
  <text x="256" y="140" font-size="12" fill="#E45756">f decreases</text>

  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4C78A8"/>
    </marker>
    <marker id="arrowRed2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E45756"/>
    </marker>
  </defs>

  <text x="45" y="370" font-size="14" fill="#333333">Level curves of f(x,y) = x&#178; - y&#178; near a saddle point. f increases along the</text>
  <text x="45" y="388" font-size="14" fill="#333333">x-direction but decreases along the y-direction: det(H) &lt; 0 signals this mix.</text>
</svg>
